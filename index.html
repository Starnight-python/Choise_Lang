<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CodePath 2.0 — Твой навигатор в IT</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#0b0e1a;--bg2:#131729;--card:#1a1f36;--card-h:#232946;
    --text:#eef0f8;--muted:#8b92b0;--accent:#7c5cff;--accent2:#22d3ee;
    --green:#34d399;--orange:#fb923c;--pink:#f472b6;
    --border:#2a3050;--shadow:0 12px 40px rgba(0,0,0,.4);
    --radius:16px;
  }
  body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;line-height:1.65}
  
  /* Градиентный фон */
  body::before{content:'';position:fixed;inset:0;background:
    radial-gradient(ellipse 900px 600px at 15% -5%,rgba(124,92,255,.15),transparent),
    radial-gradient(ellipse 700px 500px at 85% 5%,rgba(34,211,238,.1),transparent),
    radial-gradient(ellipse 500px 400px at 50% 100%,rgba(52,211,153,.06),transparent);
    pointer-events:none;z-index:-1}

  header{max-width:1280px;margin:0 auto;padding:24px 28px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:100;backdrop-filter:blur(20px);background:rgba(11,14,26,.8);border-bottom:1px solid var(--border)}
  .logo{font-size:1.5rem;font-weight:800;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent;cursor:pointer;letter-spacing:-.5px}
  .nav-back{background:transparent;border:1px solid var(--border);color:var(--text);padding:8px 18px;border-radius:10px;cursor:pointer;font-size:.88rem;transition:.2s}
  .nav-back:hover{background:var(--card);border-color:var(--accent)}
  .nav-back.hidden{display:none}

  main{max-width:1280px;margin:0 auto;padding:20px 28px 80px}
  .page{animation:fadeUp .35s ease}
  @keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}

  /* Hero */
  .hero{text-align:center;padding:50px 0 40px}
  .hero h1{font-size:clamp(2rem,5vw,3.6rem);font-weight:800;margin-bottom:18px;letter-spacing:-.5px;line-height:1.15}
  .hero h1 span{background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
  .hero p{color:var(--muted);font-size:1.15rem;max-width:680px;margin:0 auto}

  /* Choice cards */
  .choice-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:24px;margin-top:36px}
  .choice-card{background:linear-gradient(145deg,var(--card),var(--bg2));border:1px solid var(--border);border-radius:20px;padding:44px 32px;text-align:center;cursor:pointer;transition:.3s;position:relative;overflow:hidden}
  .choice-card::after{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(124,92,255,.12),rgba(34,211,238,.06));opacity:0;transition:.3s}
  .choice-card:hover{transform:translateY(-6px);border-color:var(--accent);box-shadow:var(--shadow)}
  .choice-card:hover::after{opacity:1}
  .choice-icon{font-size:3.2rem;margin-bottom:14px;position:relative;z-index:1}
  .choice-card h2{font-size:1.5rem;margin-bottom:10px;position:relative;z-index:1}
  .choice-card p{color:var(--muted);position:relative;z-index:1;font-size:.98rem}

  /* Search & Filter */
  .search-bar{margin:30px 0 24px;display:flex;gap:12px;flex-wrap:wrap;align-items:center}
  .search-input{flex:1;min-width:250px;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px 20px;color:var(--text);font-size:1rem;outline:none;transition:.2s}
  .search-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(124,92,255,.15)}
  .search-input::placeholder{color:var(--muted)}
  .filter-tags{display:flex;gap:8px;flex-wrap:wrap}
  .filter-tag{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:6px 16px;font-size:.82rem;cursor:pointer;transition:.2s;color:var(--muted);white-space:nowrap}
  .filter-tag:hover,.filter-tag.active{background:var(--accent);color:#fff;border-color:var(--accent)}

  /* Section titles */
  .section-title{font-size:2rem;margin:10px 0 8px;font-weight:700}
  .section-subtitle{color:var(--muted);margin-bottom:28px;font-size:1.02rem}

  /* Cards grid */
  .cards-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:18px}
  .item-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:24px;cursor:pointer;transition:.25s;position:relative}
  .item-card:hover{background:var(--card-h);border-color:var(--accent);transform:translateY(-4px);box-shadow:var(--shadow)}
  .item-card .tag{display:inline-block;padding:4px 12px;border-radius:8px;font-size:.73rem;margin-bottom:12px;font-weight:700;text-transform:uppercase;letter-spacing:.5px}
  .tag-lang{background:rgba(124,92,255,.15);color:var(--accent)}
  .tag-spec{background:rgba(34,211,238,.15);color:var(--accent2)}
  .tag-tool{background:rgba(52,211,153,.15);color:var(--green)}
  .tag-sys{background:rgba(251,146,60,.15);color:var(--orange)}
  .item-card h3{font-size:1.2rem;margin-bottom:8px}
  .item-card p{color:var(--muted);font-size:.92rem;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}

  /* Detail page */
  .detail-header{background:linear-gradient(135deg,var(--card),var(--bg2));border:1px solid var(--border);border-radius:20px;padding:40px;margin-bottom:28px}
  .detail-header .tag{display:inline-block;padding:6px 16px;border-radius:10px;font-size:.85rem;font-weight:700;margin-bottom:16px}
  .detail-header h1{font-size:clamp(1.8rem,4vw,2.6rem);margin-bottom:14px;line-height:1.2}
  .detail-header p{color:var(--muted);font-size:1.05rem;max-width:850px}

  .section-block{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:28px;margin-bottom:18px}
  .section-block h2{font-size:1.35rem;margin-bottom:16px;display:flex;align-items:center;gap:10px}
  .section-block h2::before{content:'';width:4px;height:22px;background:linear-gradient(180deg,var(--accent),var(--accent2));border-radius:2px;flex-shrink:0}
  .section-block ul{list-style:none}
  .section-block li{padding:10px 0 10px 28px;position:relative;border-bottom:1px solid var(--border)}
  .section-block li:last-child{border-bottom:none}
  .section-block li::before{content:'▸';position:absolute;left:8px;color:var(--accent);font-weight:bold}
  .section-block p{color:var(--muted)}
  .section-block p+p{margin-top:10px}

  .task-card{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:18px 20px;margin-bottom:10px}
  .task-card .task-title{font-weight:700;margin-bottom:5px;color:var(--accent2);font-size:.95rem}
  .task-card p{color:var(--muted);font-size:.92rem}

  .tools-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
  .tool-item{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:16px}
  .tool-item .tn{font-weight:700;margin-bottom:4px;font-size:.95rem}
  .tool-item .td{color:var(--muted);font-size:.85rem}

  .hw-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
  .hw-item{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:18px}
  .hw-item .hw-label{font-size:.78rem;text-transform:uppercase;letter-spacing:.5px;color:var(--accent);font-weight:700;margin-bottom:6px}
  .hw-item .hw-val{font-size:.92rem;color:var(--text)}

  footer{text-align:center;padding:30px;color:var(--muted);font-size:.88rem;border-top:1px solid var(--border);margin-top:40px}

  .no-results{text-align:center;padding:60px 20px;color:var(--muted);font-size:1.1rem}

  @media(max-width:600px){
    header{padding:18px 16px}
    main{padding:16px 16px 60px}
    .detail-header{padding:26px 20px}
    .section-block{padding:20px}
    .choice-card{padding:30px 22px}
  }
</style>
</head>

// ==================== РОУТИНГ И РЕНДЕРИНГ ====================

const app = document.getElementById('app');
const backBtn = document.getElementById('backBtn');
let navStack = [{page:'home'}];
let currentFilter = 'all';
let searchQuery = '';

function goHome(){ navStack=[{page:'home'}]; render(); }
function navigate(page,id){ navStack.push({page,id}); render(); window.scrollTo({top:0,behavior:'smooth'}); }
function goBack(){ if(navStack.length>1){navStack.pop();render();window.scrollTo({top:0,behavior:'smooth'});} }

function render(){
  const cur=navStack[navStack.length-1];
  backBtn.classList.toggle('hidden',navStack.length<=1);
  if(cur.page==='home') renderHome();
  else if(cur.page==='languages') renderListPage('languages');
  else if(cur.page==='specialties') renderListPage('specialties');
  else if(cur.page==='language') renderDetail('language',cur.id);
  else if(cur.page==='specialty') renderDetail('specialty',cur.id);
}

function renderHome(){
  app.innerHTML=`<div class="page">
    <div class="hero">
      <h1>Не знаешь, <span>с чего начать</span> в IT?</h1>
      <p>Расширенный навигатор: 15+ языков, системные инструменты, 15 специальностей. Выбери путь или исследуй всё.</p>
    </div>
    <div class="choice-grid">
      <div class="choice-card" onclick="navigate('languages')">
        <div class="choice-icon">💻</div>
        <h2>Языки и инструменты</h2>
        <p>HTML, CSS, JS, Python, Bash, CMD и ещё 10+ языков. Описание, план обучения, задачки.</p>
      </div>
      <div class="choice-card" onclick="navigate('specialties')">
        <div class="choice-icon">🎯</div>
        <h2>IT-специальности</h2>
        <p>15 направлений: от Frontend до Cloud Architect. Инструменты, железо, задачи для старта.</p>
      </div>
    </div>
  </div>`;
}

function renderListPage(type){
  const data = type==='languages' ? languages : specialties;
  const title = type==='languages' ? 'Языки и инструменты' : 'IT-специальности';
  const subtitle = type==='languages'
    ? 'Выбери язык или инструмент. Используй поиск и фильтры для быстрой навигации.'
    : 'Выбери специальность. Узнай про инструменты, требования к железу и первые задачи.';

  // Collect unique tags
  const tags=['all',...new Set(data.map(d=>d.tag))];

  app.innerHTML=`<div class="page">
    <h1 class="section-title">${title}</h1>
    <p class="section-subtitle">${subtitle}</p>
    <div class="search-bar">
      <input class="search-input" type="text" placeholder="🔍 Поиск по названию или описанию..." id="searchInput" value="${searchQuery}">
      <div class="filter-tags" id="filterTags">
        ${tags.map(t=>`<span class="filter-tag${currentFilter===t?' active':''}" data-filter="${t}">${t==='all'?'Все':t}</span>`).join('')}
      </div>
    </div>
    <div class="cards-grid" id="cardsGrid"></div>
  </div>`;

  // Bind events
  document.getElementById('searchInput').addEventListener('input',e=>{searchQuery=e.target.value;filterAndRender(data,type);});
  document.querySelectorAll('.filter-tag').forEach(el=>{
    el.addEventListener('click',()=>{
      currentFilter=el.dataset.filter;
      document.querySelectorAll('.filter-tag').forEach(t=>t.classList.remove('active'));
      el.classList.add('active');
      filterAndRender(data,type);
    });
  });

  filterAndRender(data,type);
}

function filterAndRender(data,type){
  const q=searchQuery.toLowerCase();
  const filtered=data.filter(d=>{
    const matchSearch=!q||d.name.toLowerCase().includes(q)||d.short.toLowerCase().includes(q)||(d.tag&&d.tag.toLowerCase().includes(q));
    const matchFilter=currentFilter==='all'||d.tag===currentFilter;
    return matchSearch&&matchFilter;
  });

  const grid=document.getElementById('cardsGrid');
  if(!filtered.length){
    grid.innerHTML='<div class="no-results">😕 Ничего не найдено. Попробуй другой запрос или фильтр.</div>';
    return;
  }

  grid.innerHTML=filtered.map(d=>`
    <div class="item-card" onclick="navigate('${type==='languages'?'language':'specialty'}','${d.id}')">
      <span class="tag ${d.tagClass||'tag-lang'}">${d.tag}</span>
      <h3>${d.name}</h3>
      <p>${d.short}</p>
    </div>
  `).join('');
}

function renderDetail(type,id){
  const data=type==='language'?languages:specialties;
  const item=data.find(d=>d.id===id);
  if(!item){goHome();return;}

  let html=`<div class="page">
    <div class="detail-header">
      <span class="tag ${item.tagClass||'tag-lang'}">${item.tag}</span>
      <h1>${item.name}</h1>
      <p>${item.full}</p>
    </div>`;

  if(type==='language'){
    html+=`
    <div class="section-block"><h2>С чего начать</h2><ul>${item.start.map(s=>`<li>${s}</li>`).join('')}</ul></div>
    <div class="section-block"><h2>Задачки для новичков</h2>${item.tasks.map(t=>`<div class="task-card"><div class="task-title">${t.title}</div><p>${t.desc}</p></div>`).join('')}</div>`;
  } else {
    html+=`
    <div class="section-block"><h2>Инструменты и технологии</h2><div class="tools-grid">${item.tools.map(t=>`<div class="tool-item"><div class="tn">${t.n}</div><div class="td">${t.d}</div></div>`).join('')}</div></div>
    <div class="section-block"><h2>Компьютер и система</h2><div class="hw-grid">
      <div class="hw-item"><div class="hw-label">Операционная система</div><div class="hw-val">${item.hw.os}</div></div>
      <div class="hw-item"><div class="hw-label">Linux</div><div class="hw-val">${item.hw.linux}</div></div>
      <div class="hw-item"><div class="hw-label">Требования к ПК</div><div class="hw-val">${item.hw.pc}</div></div>
      <div class="hw-item"><div class="hw-label">Дополнительно</div><div class="hw-val">${item.hw.extra}</div></div>
    </div></div>
    <div class="section-block"><h2>Задачки для новичков</h2>${item.tasks.map(t=>`<div class="task-card"><div class="task-title">${t.t}</div><p>${t.d}</p></div>`).join('')}</div>`;
  }

  html+='</div>';
  app.innerHTML=html;
}

// Init
render();
</script>
</body>
</html>
