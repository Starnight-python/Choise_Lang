<title>CodePath — Найди свой путь в IT</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg: #0f1220;
    --bg-2: #171a2e;
    --card: #1e2238;
    --card-hover: #262b47;
    --text: #e8eaf3;
    --muted: #9aa0b8;
    --accent: #7c5cff;
    --accent-2: #22d3ee;
    --border: #2a2f4a;
    --shadow: 0 10px 30px rgba(0,0,0,0.35);
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, sans-serif;
    background: radial-gradient(1200px 600px at 10% -10%, rgba(124,92,255,0.18), transparent 60%),
                radial-gradient(900px 500px at 100% 0%, rgba(34,211,238,0.12), transparent 60%),
                var(--bg);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.6;
  }
  header {
    padding: 28px 24px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    max-width: 1200px;
    margin: 0 auto;
  }
  .logo {
    font-size: 1.6rem;
    font-weight: 800;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    cursor: pointer;
  }
  .nav-back {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text);
    padding: 8px 16px;
    border-radius: 10px;
    cursor: pointer;
    font-size: 0.9rem;
    transition: 0.2s;
  }
  .nav-back:hover { background: var(--card); border-color: var(--accent); }
  .nav-back.hidden { display: none; }

  main {
    max-width: 1200px;
    margin: 0 auto;
    padding: 20px 24px 80px;
  }
  .page { animation: fadeIn 0.4s ease; }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .hero {
    text-align: center;
    padding: 40px 0 50px;
  }
  .hero h1 {
    font-size: clamp(2rem, 5vw, 3.4rem);
    font-weight: 800;
    margin-bottom: 16px;
    letter-spacing: -0.5px;
  }
  .hero h1 span {
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .hero p {
    color: var(--muted);
    font-size: 1.1rem;
    max-width: 640px;
    margin: 0 auto;
  }

  .choice-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
    gap: 24px;
    margin-top: 40px;
  }
  .choice-card {
    background: linear-gradient(145deg, var(--card), var(--bg-2));
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 40px 30px;
    text-align: center;
    cursor: pointer;
    transition: 0.3s;
    position: relative;
    overflow: hidden;
  }
  .choice-card::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, rgba(124,92,255,0.15), rgba(34,211,238,0.08));
    opacity: 0;
    transition: 0.3s;
  }
  .choice-card:hover {
    transform: translateY(-6px);
    border-color: var(--accent);
    box-shadow: var(--shadow);
  }
  .choice-card:hover::before { opacity: 1; }
  .choice-icon {
    font-size: 3.5rem;
    margin-bottom: 16px;
    position: relative;
  }
  .choice-card h2 {
    font-size: 1.6rem;
    margin-bottom: 10px;
    position: relative;
  }
  .choice-card p {
    color: var(--muted);
    position: relative;
  }

  .section-title {
    font-size: 2rem;
    margin: 30px 0 20px;
    font-weight: 700;
  }
  .section-subtitle {
    color: var(--muted);
    margin-bottom: 30px;
  }

  .cards-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 20px;
  }
  .item-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 24px;
    cursor: pointer;
    transition: 0.25s;
  }
  .item-card:hover {
    background: var(--card-hover);
    border-color: var(--accent);
    transform: translateY(-4px);
    box-shadow: var(--shadow);
  }
  .item-card .tag {
    display: inline-block;
    background: rgba(124,92,255,0.15);
    color: var(--accent-2);
    padding: 4px 10px;
    border-radius: 8px;
    font-size: 0.75rem;
    margin-bottom: 12px;
    font-weight: 600;
  }
  .item-card h3 {
    font-size: 1.25rem;
    margin-bottom: 8px;
  }
  .item-card p {
    color: var(--muted);
    font-size: 0.95rem;
  }

  /* Detail page */
  .detail-header {
    background: linear-gradient(135deg, var(--card), var(--bg-2));
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 40px;
    margin-bottom: 30px;
  }
  .detail-header .tag {
    display: inline-block;
    background: rgba(34,211,238,0.15);
    color: var(--accent-2);
    padding: 6px 14px;
    border-radius: 10px;
    font-size: 0.85rem;
    font-weight: 600;
    margin-bottom: 16px;
  }
  .detail-header h1 {
    font-size: 2.4rem;
    margin-bottom: 14px;
  }
  .detail-header p {
    color: var(--muted);
    font-size: 1.05rem;
    max-width: 800px;
  }

  .section-block {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 28px;
    margin-bottom: 20px;
  }
  .section-block h2 {
    font-size: 1.4rem;
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .section-block h2::before {
    content: '';
    width: 4px;
    height: 22px;
    background: linear-gradient(180deg, var(--accent), var(--accent-2));
    border-radius: 2px;
  }
  .section-block ul {
    list-style: none;
    padding: 0;
  }
  .section-block li {
    padding: 10px 0 10px 28px;
    position: relative;
    color: var(--text);
    border-bottom: 1px solid var(--border);
  }
  .section-block li:last-child { border-bottom: none; }
  .section-block li::before {
    content: '▸';
    position: absolute;
    left: 8px;
    color: var(--accent);
    font-weight: bold;
  }
  .section-block p { color: var(--muted); }
  .section-block p + p { margin-top: 10px; }

  .task-card {
    background: var(--bg-2);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 18px 20px;
    margin-bottom: 12px;
  }
  .task-card .task-title {
    font-weight: 600;
    margin-bottom: 6px;
    color: var(--accent-2);
  }
  .task-card p { color: var(--muted); font-size: 0.95rem; }

  .tools-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 14px;
  }
  .tool-item {
    background: var(--bg-2);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
  }
  .tool-item .tool-name {
    font-weight: 600;
    margin-bottom: 4px;
  }
  .tool-item .tool-desc {
    color: var(--muted);
    font-size: 0.88rem;
  }

  footer {
    text-align: center;
    padding: 30px;
    color: var(--muted);
    font-size: 0.9rem;
    border-top: 1px solid var(--border);
    margin-top: 40px;
  }

  @media (max-width: 600px) {
    .detail-header { padding: 26px 20px; }
    .detail-header h1 { font-size: 1.8rem; }
    .section-block { padding: 20px; }
  }
</style>
</head>

// ===== ЛОГИКА =====
const app = document.getElementById('app');
const backBtn = document.getElementById('backBtn');
let history = ['home'];

function showPage(page, id = null) {
  history.push(page + (id ? ':' + id : ''));
  render(page, id);
  backBtn.classList.toggle('hidden', history.length <= 1);
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function goBack() {
  if (history.length > 1) {
    history.pop();
    const prev = history[history.length - 1];
    const [page, id] = prev.split(':');
    render(page, id);
    backBtn.classList.toggle('hidden', history.length <= 1);
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
}

function render(page, id) {
  if (page === 'home') renderHome();
  else if (page === 'languages') renderLanguages();
  else if (page === 'language') renderLanguage(id);
  else if (page === 'specialties') renderSpecialties();
  else if (page === 'specialty') renderSpecialty(id);
}

function renderHome() {
  app.innerHTML = `
    <div class="page">
      <div class="hero">
        <h1>Не знаешь, <span>с чего начать</span> в IT?</h1>
        <p>Мы поможем разобраться в языках программирования и IT-специальностях. Выбери, что тебе интереснее изучить.</p>
      </div>
      <div class="choice-grid">
        <div class="choice-card" onclick="showPage('languages')">
          <div class="choice-icon">💻</div>
          <h2>Языки программирования</h2>
          <p>Python, JavaScript, Java, C++ и другие. Узнай, какой язык подойдёт именно тебе.</p>
        </div>
        <div class="choice-card" onclick="showPage('specialties')">
          <div class="choice-icon">🎯</div>
          <h2>IT-специальности</h2>
          <p>Frontend, GameDev, Data Science, DevOps и другие. Найди своё направление.</p>
        </div>
      </div>
    </div>
  `;
}

function renderLanguages() {
  const cards = languages.map(l => `
    <div class="item-card" onclick="showPage('language', '${l.id}')">
      <span class="tag">${l.tag}</span>
      <h3>${l.name}</h3>
      <p>${l.short}</p>
    </div>
  `).join('');
  app.innerHTML = `
    <div class="page">
      <h1 class="section-title">Языки программирования</h1>
      <p class="section-subtitle">Выбери язык, чтобы узнать подробнее: что на нём делают, с чего начать и какие задачи решить.</p>
      <div class="cards-grid">${cards}</div>
    </div>
  `;
}

function renderLanguage(id) {
  const l = languages.find(x => x.id === id);
  if (!l) { renderHome(); return; }
  app.innerHTML = `
    <div class="page">
      <div class="detail-header">
        <span class="tag">${l.tag}</span>
        <h1>${l.name}</h1>
        <p>${l.full}</p>
      </div>

      <div class="section-block">
        <h2>С чего начать</h2>
        <ul>
          ${l.start.map(s => `<li>${s}</li>`).join('')}
        </ul>
      </div>

      <div class="section-block">
        <h2>Задачки для новичков</h2>
        ${l.tasks.map(t => `
          <div class="task-card">
            <div class="task-title">${t.title}</div>
            <p>${t.desc}</p>
          </div>
        `).join('')}
      </div>
    </div>
  `;
}

function renderSpecialties() {
  const cards = specialties.map(s => `
    <div class="item-card" onclick="showPage('specialty', '${s.id}')">
      <span class="tag">${s.tag}</span>
      <h3>${s.name}</h3>
      <p>${s.short}</p>
    </div>
  `).join('');
  app.innerHTML = `
    <div class="page">
      <h1 class="section-title">IT-специальности</h1>
      <p class="section-subtitle">Узнай, чем занимаются специалисты, какие инструменты нужны и какое железо потянет.</p>
      <div class="cards-grid">${cards}</div>
    </div>
  `;
}

function renderSpecialty(id) {
  const s = specialties.find(x => x.id === id);
  if (!s) { renderHome(); return; }
  app.innerHTML = `
    <div class="page">
      <div class="detail-header">
        <span class="tag">${s.tag}</span>
        <h1>${s.name}</h1>
        <p>${s.full}</p>
      </div>

      <div class="section-block">
        <h2>Что понадобится изучить</h2>
        <div class="tools-grid">
          ${s.tools.map(t => `
            <div class="tool-item">
              <div class="tool-name">${t.name}</div>
              <div class="tool-desc">${t.desc}</div>
            </div>
          `).join('')}
        </div>
      </div>

      <div class="section-block">
        <h2>Компьютер и система</h2>
        <ul>
          <li><strong>Операционная система:</strong> ${s.hardware.os}</li>
          <li><strong>Какой Linux подойдёт:</strong> ${s.hardware.linux}</li>
          <li><strong>Требования к ПК:</strong> ${s.hardware.pc}</li>
          <li><strong>Дополнительно:</strong> ${s.hardware.extras}</li>
        </ul>
      </div>

      <div class="section-block">
        <h2>Задачки для новичков</h2>
        ${s.tasks.map(t => `
          <div class="task-card">
            <div class="task-title">${t.title}</div>
            <p>${t.desc}</p>
          </div>
        `).join('')}
      </div>
    </div>
  `;
}
