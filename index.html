<title>CodePath 2.0 — Твой навигатор в IT</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg: #0b0e1a;
    --bg-2: #131729;
    --card: #1a1f36;
    --card-hover: #232946;
    --text: #e8eaf6;
    --muted: #8b92b0;
    --accent: #7c5cff;
    --accent-2: #22d3ee;
    --accent-3: #f472b6;
    --border: #2a3050;
    --shadow: 0 12px 40px rgba(0,0,0,0.4);
    --radius: 16px;
  }
  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: 
      radial-gradient(ellipse 900px 600px at 15% -5%, rgba(124,92,255,0.15), transparent),
      radial-gradient(ellipse 700px 500px at 85% 0%, rgba(34,211,238,0.1), transparent),
      var(--bg);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.65;
  }

  /* Header */
  header {
    position: sticky; top: 0; z-index: 100;
    backdrop-filter: blur(16px);
    background: rgba(11,14,26,0.85);
    border-bottom: 1px solid var(--border);
    padding: 16px 24px;
  }
  .header-inner {
    max-width: 1200px; margin: 0 auto;
    display: flex; justify-content: space-between; align-items: center; gap: 16px;
  }
  .logo {
    font-size: 1.5rem; font-weight: 800; cursor: pointer; white-space: nowrap;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .nav-back {
    background: transparent; border: 1px solid var(--border); color: var(--text);
    padding: 8px 18px; border-radius: 10px; cursor: pointer; font-size: 0.88rem;
    transition: 0.2s; white-space: nowrap;
  }
  .nav-back:hover { background: var(--card); border-color: var(--accent); }
  .nav-back.hidden { display: none; }

  /* Search */
  .search-wrap { flex: 1; max-width: 400px; position: relative; }
  .search-wrap input {
    width: 100%; padding: 10px 16px 10px 40px; border-radius: 12px;
    border: 1px solid var(--border); background: var(--bg-2); color: var(--text);
    font-size: 0.95rem; outline: none; transition: 0.2s;
  }
  .search-wrap input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(124,92,255,0.15); }
  .search-wrap::before {
    content: '🔍'; position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
    font-size: 0.9rem; opacity: 0.6;
  }
  .search-wrap.hidden { display: none; }

  main { max-width: 1200px; margin: 0 auto; padding: 24px 24px 80px; }
  .page { animation: fadeUp 0.35s ease; }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* Hero */
  .hero { text-align: center; padding: 48px 0 56px; }
  .hero h1 {
    font-size: clamp(2rem, 5vw, 3.2rem); font-weight: 800;
    margin-bottom: 16px; letter-spacing: -0.5px;
  }
  .hero h1 span {
    background: linear-gradient(135deg, var(--accent), var(--accent-2), var(--accent-3));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .hero p { color: var(--muted); font-size: 1.1rem; max-width: 620px; margin: 0 auto; }

  /* Choice Cards */
  .choice-grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 20px; margin-top: 36px;
  }
  .choice-card {
    background: linear-gradient(145deg, var(--card), var(--bg-2));
    border: 1px solid var(--border); border-radius: 20px;
    padding: 36px 28px; text-align: center; cursor: pointer;
    transition: 0.3s; position: relative; overflow: hidden;
  }
  .choice-card::after {
    content: ''; position: absolute; inset: 0;
    background: linear-gradient(135deg, rgba(124,92,255,0.12), rgba(34,211,238,0.06));
    opacity: 0; transition: 0.3s;
  }
  .choice-card:hover { transform: translateY(-5px); border-color: var(--accent); box-shadow: var(--shadow); }
  .choice-card:hover::after { opacity: 1; }
  .choice-icon { font-size: 3rem; margin-bottom: 14px; position: relative; z-index: 1; }
  .choice-card h2 { font-size: 1.4rem; margin-bottom: 8px; position: relative; z-index: 1; }
  .choice-card p { color: var(--muted); font-size: 0.95rem; position: relative; z-index: 1; }

  /* Section titles */
  .section-title { font-size: 1.9rem; margin: 28px 0 8px; font-weight: 700; }
  .section-subtitle { color: var(--muted); margin-bottom: 24px; }

  /* Filter tabs */
  .filter-tabs {
    display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 24px;
  }
  .filter-tab {
    padding: 8px 18px; border-radius: 10px; border: 1px solid var(--border);
    background: transparent; color: var(--muted); cursor: pointer;
    font-size: 0.88rem; transition: 0.2s; white-space: nowrap;
  }
  .filter-tab:hover { border-color: var(--accent); color: var(--text); }
  .filter-tab.active {
    background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600;
  }

  /* Cards grid */
  .cards-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 18px;
  }
  .item-card {
    background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 22px; cursor: pointer; transition: 0.25s;
  }
  .item-card:hover {
    background: var(--card-hover); border-color: var(--accent);
    transform: translateY(-3px); box-shadow: var(--shadow);
  }
  .item-card .tag {
    display: inline-block; padding: 4px 10px; border-radius: 8px;
    font-size: 0.73rem; margin-bottom: 10px; font-weight: 600;
  }
  .tag-lang { background: rgba(124,92,255,0.15); color: var(--accent); }
  .tag-spec { background: rgba(34,211,238,0.15); color: var(--accent-2); }
  .tag-tool { background: rgba(244,114,182,0.15); color: var(--accent-3); }
  .item-card h3 { font-size: 1.2rem; margin-bottom: 6px; }
  .item-card p { color: var(--muted); font-size: 0.92rem; }

  /* Detail page */
  .detail-header {
    background: linear-gradient(135deg, var(--card), var(--bg-2));
    border: 1px solid var(--border); border-radius: 20px;
    padding: 36px; margin-bottom: 24px;
  }
  .detail-header .tag {
    display: inline-block; padding: 6px 14px; border-radius: 10px;
    font-size: 0.85rem; font-weight: 600; margin-bottom: 14px;
  }
  .detail-header h1 { font-size: 2.2rem; margin-bottom: 12px; }
  .detail-header p { color: var(--muted); font-size: 1.05rem; max-width: 800px; }

  .section-block {
    background: var(--card); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 26px; margin-bottom: 18px;
  }
  .section-block h2 {
    font-size: 1.3rem; margin-bottom: 14px; display: flex; align-items: center; gap: 10px;
  }
  .section-block h2::before {
    content: ''; width: 4px; height: 20px; border-radius: 2px;
    background: linear-gradient(180deg, var(--accent), var(--accent-2));
  }
  .section-block ul { list-style: none; }
  .section-block li {
    padding: 9px 0 9px 26px; position: relative; border-bottom: 1px solid var(--border);
  }
  .section-block li:last-child { border-bottom: none; }
  .section-block li::before {
    content: '▸'; position: absolute; left: 6px; color: var(--accent); font-weight: bold;
  }
  .section-block p { color: var(--muted); }
  .section-block p + p { margin-top: 8px; }

  .task-card {
    background: var(--bg-2); border: 1px solid var(--border);
    border-radius: 12px; padding: 16px 18px; margin-bottom: 10px;
  }
  .task-card .task-title { font-weight: 600; margin-bottom: 4px; color: var(--accent-2); }
  .task-card p { color: var(--muted); font-size: 0.93rem; }

  .tools-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px;
  }
  .tool-item {
    background: var(--bg-2); border: 1px solid var(--border); border-radius: 12px; padding: 14px;
  }
  .tool-item .tool-name { font-weight: 600; margin-bottom: 3px; font-size: 0.95rem; }
  .tool-item .tool-desc { color: var(--muted); font-size: 0.85rem; }

  .no-results {
    text-align: center; padding: 60px 20px; color: var(--muted); font-size: 1.1rem;
  }

  footer {
    text-align: center; padding: 28px; color: var(--muted); font-size: 0.85rem;
    border-top: 1px solid var(--border); margin-top: 40px;
  }

  @media (max-width: 600px) {
    .header-inner { flex-wrap: wrap; }
    .search-wrap { order: 3; max-width: 100%; margin-top: 8px; }
    .detail-header { padding: 24px 18px; }
    .detail-header h1 { font-size: 1.7rem; }
    .section-block { padding: 18px; }
    .filter-tabs { gap: 6px; }
    .filter-tab { padding: 6px 14px; font-size: 0.82rem; }
  }
</style>
</head>

// Категории для фильтрации языков
const langCategories = [
  { id: 'all', label: 'Все' },
  { id: 'web-basics', label: '🌐 Веб-основы' },
  { id: 'tools', label: '🔧 Инструменты' },
  { id: 'web', label: '💻 Веб' },
  { id: 'general', label: '⚙️ Универсальные' },
  { id: 'systems', label: '🖥️ Системные' },
  { id: 'backend', label: '☁️ Backend' },
  { id: 'mobile', label: '📱 Мобильные' }
];

// ===================== ЛОГИКА =====================

const app = document.getElementById('app');
const backBtn = document.getElementById('backBtn');
const searchWrap = document.getElementById('searchWrap');
const searchInput = document.getElementById('searchInput');

let navHistory = ['home'];
let currentFilter = 'all';
let currentSearchQuery = '';

function goHome() {
  navHistory = ['home'];
  renderPage();
}

function navigate(page, id = null) {
  const entry = id ? `${page}:${id}` : page;
  navHistory.push(entry);
  currentSearchQuery = '';
  searchInput.value = '';
  renderPage();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function goBack() {
  if (navHistory.length > 1) {
    navHistory.pop();
    currentSearchQuery = '';
    searchInput.value = '';
    renderPage();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
}

function renderPage() {
  const current = navHistory[navHistory.length - 1];
  const [page, id] = current.split(':');

  backBtn.classList.toggle('hidden', navHistory.length <= 1);
  
  // Поиск показываем только на страницах списков
  const showSearch = ['languages', 'specialties'].includes(page);
  searchWrap.classList.toggle('hidden', !showSearch);

  switch (page) {
    case 'home': renderHome(); break;
    case 'languages': renderLanguages(); break;
    case 'language': renderLanguageDetail(id); break;
    case 'specialties': renderSpecialties(); break;
    case 'specialty': renderSpecialtyDetail(id); break;
    default: renderHome();
  }
}

// --- HOME ---
function renderHome() {
  app.innerHTML = `
    <div class="page">
      <div class="hero">
        <h1>Не знаешь, <span>с чего начать</span> в IT?</h1>
        <p>Языки программирования, инструменты и 16 специальностей. Найди свой путь.</p>
      </div>
      <div class="choice-grid">
        <div class="choice-card" onclick="navigate('languages')">
          <div class="choice-icon">💻</div>
          <h2>Языки и технологии</h2>
          <p>16 языков + HTML, CSS, SQL, Bash, CMD. Фильтрация по категориям.</p>
        </div>
        <div class="choice-card" onclick="navigate('specialties')">
          <div class="choice-icon">🎯</div>
          <h2>IT-специальности</h2>
          <p>16 направлений: от Frontend до Tech Writer. Железо, инструменты, задачи.</p>
        </div>
      </div>
    </div>
  `;
}

// --- LANGUAGES LIST ---
function renderLanguages() {
  const filtered = getFilteredLanguages();
  
  const tabs = langCategories.map(c => 
    `<button class="filter-tab ${currentFilter === c.id ? 'active' : ''}" 
            onclick="setFilter('${c.id}')">${c.label}</button>`
  ).join('');

  const cards = filtered.length ? filtered.map(l => `
    <div class="item-card" onclick="navigate('language', '${l.id}')">
      <span class="tag tag-lang">${l.tag}</span>
      <h3>${l.name}</h3>
      <p>${l.short}</p>
    </div>
  `).join('') : '<div class="no-results">Ничего не найдено 😔 Попробуй другой запрос или фильтр.</div>';

  app.innerHTML = `
    <div class="page">
      <h1 class="section-title">Языки и технологии</h1>
      <p class="section-subtitle">Выбери категорию или воспользуйся поиском сверху.</p>
      <div class="filter-tabs">${tabs}</div>
      <div class="cards-grid">${cards}</div>
    </div>
  `;
}

function getFilteredLanguages() {
  let items = languages;
  if (currentFilter !== 'all') {
    items = items.filter(l => l.category === currentFilter);
  }
  if (currentSearchQuery) {
    const q = currentSearchQuery.toLowerCase();
    items = items.filter(l => 
      l.name.toLowerCase().includes(q) || 
      l.short.toLowerCase().includes(q) ||
      l.tag.toLowerCase().includes(q)
    );
  }
  return items;
}

function setFilter(cat) {
  currentFilter = cat;
  renderLanguages();
}

function onSearch(val) {
  currentSearchQuery = val.trim();
  const current = navHistory[navHistory.length - 1];
  if (current === 'languages') renderLanguages();
  else if (current === 'specialties') renderSpecialties();
}

// --- LANGUAGE DETAIL ---
function renderLanguageDetail(id) {
  const l = languages.find(x => x.id === id);
  if (!l) { goHome(); return; }
  
  app.innerHTML = `
    <div class="page">
      <div class="detail-header">
        <span class="tag tag-lang">${l.tag}</span>
        <h1>${l.name}</h1>
        <p>${l.full}</p>
      </div>
      <div class="section-block">
        <h2>🚀 С чего начать</h2>
        <ul>${l.start.map(s => `<li>${s}</li>`).join('')}</ul>
      </div>
      <div class="section-block">
        <h2>📝 Задачи для новичков</h2>
        ${l.tasks.map(t => `
          <div class="task-card">
            <div class="task-title">${t.title}</div>
            <p>${t.desc}</p>
          </div>
        `).join('')}
      </div>
    </div>
  `;
}

// --- SPECIALTIES LIST ---
function renderSpecialties() {
  let items = specialties;
  if (currentSearchQuery) {
    const q = currentSearchQuery.toLowerCase();
    items = items.filter(s =>
      s.name.toLowerCase().includes(q) ||
      s.short.toLowerCase().includes(q) ||
      s.tag.toLowerCase().includes(q)
    );
  }

  const cards = items.length ? items.map(s => `
    <div class="item-card" onclick="navigate('specialty', '${s.id}')">
      <span class="tag tag-spec">${s.tag}</span>
      <h3>${s.name}</h3>
      <p>${s.short}</p>
    </div>
  `).join('') : '<div class="no-results">Ничего не найдено 😔 Попробуй другой запрос.</div>';

  app.innerHTML = `
    <div class="page">
      <h1 class="section-title">IT-специальности</h1>
      <p class="section-subtitle">16 направлений. Используй поиск сверху для быстрой навигации.</p>
      <div class="cards-grid">${cards}</div>
    </div>
  `;
}

// --- SPECIALTY DETAIL ---
function renderSpecialtyDetail(id) {
  const s = specialties.find(x => x.id === id);
  if (!s) { goHome(); return; }

  app.innerHTML = `
    <div class="page">
      <div class="detail-header">
        <span class="tag tag-spec">${s.tag}</span>
        <h1>${s.name}</h1>
        <p>${s.full}</p>
      </div>

      <div class="section-block">
        <h2>🛠 Что нужно изучить</h2>
        <div class="tools-grid">
          ${s.tools.map(t => `
            <div class="tool-item">
              <div class="tool-name">${t.name}</div>
              <div class="tool-desc">${t.desc}</div>
            </div>
          `).join('')}
        </div>
      </div>

      <div class="section-block">
        <h2>🖥 Компьютер и система</h2>
        <ul>
          <li><strong>ОС:</strong> ${s.hardware.os}</li>
          <li><strong>Linux:</strong> ${s.hardware.linux}</li>
          <li><strong>Требования:</strong> ${s.hardware.pc}</li>
          <li><strong>Дополнительно:</strong> ${s.hardware.extras}</li>
        </ul>
      </div>

      <div class="section-block">
        <h2>📝 Задачи для старта</h2>
        ${s.tasks.map(t => `
          <div class="task-card">
            <div class="task-title">${t.title}</div>
            <p>${t.desc}</p>
          </div>
        `).join('')}
      </div>
    </div>
  `;
}

// Init
renderPage();
</script>
